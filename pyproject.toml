[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-rover-static-nav"
version = "1.0.0"
description = "Camera-free autonomous static mapping and waypoint navigation for CAT Rover"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "pyserial==3.5", "rplidar==0.9.2"]

[project.scripts]
cat-rover = "cat_rover_nav.__main__:main"

[tool.setuptools.packages.find]
include = ["cat_rover_nav*"]

[tool.setuptools.package-data]
cat_rover_nav = ["map_editor.html"]
